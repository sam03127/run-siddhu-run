<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11142b">
  <title>Run, Siddhu, Run!</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", system-ui, sans-serif;
      background: #11142b;
      color: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --pink: #ff6c9d;
      --yellow: #ffe66d;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 280px;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 35%, #28335b 0, #171a36 50%, #101225 100%);
    }

    button, label { font: inherit; }

    .game-shell {
      position: relative;
      width: min(100vw, 56.25svh, 480px);
      height: min(100svh, 177.78vw, 854px);
      min-height: 420px;
      overflow: hidden;
      isolation: isolate;
      background: #a3e6ee;
      box-shadow: 0 24px 90px #070914aa, 0 0 0 1px #ffffff18;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .hud {
      position: absolute;
      z-index: 2;
      inset: max(14px, env(safe-area-inset-top)) 14px auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
    }

    .score-card, .best-card {
      min-width: 94px;
      padding: 9px 13px 10px;
      border: 1px solid #ffffff40;
      border-radius: 17px;
      background: #12152ccc;
      box-shadow: 0 5px 18px #13142b30;
      backdrop-filter: blur(8px);
    }

    .score-card strong, .best-card strong {
      display: block;
      font-size: clamp(20px, 6vw, 27px);
      line-height: 1;
      letter-spacing: .03em;
      font-variant-numeric: tabular-nums;
    }

    .score-card strong { color: var(--yellow); }
    .best-card strong { color: #aaf2ed; }

    .eyebrow {
      display: block;
      margin-bottom: 4px;
      color: #ffffffa6;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .sound-button {
      position: absolute;
      z-index: 3;
      top: max(78px, calc(env(safe-area-inset-top) + 64px));
      right: 16px;
      width: 39px;
      height: 39px;
      display: grid;
      place-items: center;
      padding: 0;
      border: 1px solid #ffffff55;
      border-radius: 50%;
      color: white;
      background: #17192dcc;
      cursor: pointer;
    }

    .sound-button:focus-visible, .action:focus-visible, .control:focus-visible, .upload:focus-visible {
      outline: 3px solid white;
      outline-offset: 3px;
    }

    .overlay {
      position: absolute;
      z-index: 4;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px 20px;
      background: linear-gradient(180deg, #12152b28, #10122588);
      transition: opacity .2s ease, visibility .2s ease;
    }

    .overlay.hidden {
      visibility: hidden;
      opacity: 0;
      pointer-events: none;
    }

    .panel {
      width: min(100%, 350px);
      padding: 24px 22px 21px;
      border: 1px solid #ffffff40;
      border-radius: 27px;
      background: #17192beF;
      box-shadow: 0 18px 55px #0b0d1b75;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding: 6px 10px;
      border: 1px solid #ffffff25;
      border-radius: 99px;
      color: #caeee9;
      background: #ffffff0c;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: clamp(32px, 9.5vw, 47px);
      font-weight: 1000;
      line-height: .96;
      letter-spacing: -.055em;
      text-shadow: 0 3px 0 #ff6c9d;
    }

    h1 span { color: var(--yellow); }

    .subhead {
      margin: 14px 0 18px;
      color: #d3d5e5;
      font-size: 13px;
      line-height: 1.5;
    }

    .upload {
      width: 100%;
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px dashed #ffffff6e;
      border-radius: 14px;
      color: #f5f2ff;
      background: #ffffff0a;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: background .15s, border-color .15s;
    }

    .upload:hover { background: #ffffff16; border-color: #fff; }
    .upload input { position: absolute; width: 1px; height: 1px; opacity: 0; }

    .photo-status {
      min-height: 18px;
      margin: 7px 0 10px;
      color: #a8e8d8;
      font-size: 11px;
    }

    .action {
      width: 100%;
      min-height: 53px;
      border: 0;
      border-radius: 16px;
      color: #20192a;
      background: linear-gradient(135deg, #ffe66d, #ffae67);
      box-shadow: 0 5px 0 #d3744e, 0 10px 25px #ffae6740;
      cursor: pointer;
      font-size: 16px;
      font-weight: 1000;
      letter-spacing: .015em;
      transition: transform .12s, filter .12s;
    }

    .action:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .action:active { transform: translateY(3px); box-shadow: 0 2px 0 #d3744e; }

    .hint {
      margin: 14px 0 0;
      color: #aeb1c8;
      font-size: 10px;
    }

    .controls {
      position: absolute;
      z-index: 3;
      inset: auto 16px max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: space-between;
      align-items: end;
      pointer-events: none;
    }

    .pad, .jump-wrap { pointer-events: auto; }
    .pad { display: flex; gap: 9px; }

    .control {
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 1px solid #ffffff5c;
      border-radius: 17px;
      color: white;
      background: #17192dcc;
      box-shadow: 0 5px 15px #10122555;
      cursor: pointer;
      font-size: 21px;
      font-weight: 900;
      -webkit-tap-highlight-color: transparent;
    }

    .control:active { transform: translateY(2px); background: #42415a; }
    .jump-control { width: 58px; height: 58px; border-radius: 50%; color: #1d1830; background: var(--yellow); font-size: 25px; }
    .control-label { display: block; margin-top: 4px; color: #ffffffbd; font-size: 9px; font-weight: 900; letter-spacing: .12em; text-align: center; }

    .toast {
      position: absolute;
      z-index: 3;
      top: 20%;
      left: 50%;
      width: max-content;
      max-width: 82%;
      padding: 9px 15px;
      border: 1px solid #ffffff40;
      border-radius: 99px;
      color: white;
      background: #15172ddb;
      font-size: 12px;
      font-weight: 900;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity .2s, transform .2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-height: 520px) and (orientation: landscape) {
      .game-shell { width: min(100vw, 56.25svh, 480px); height: min(100svh, 177.78vw, 854px); }
      .panel { padding: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="Run, Siddhu, Run endless runner game">
    <canvas id="game" aria-label="Three-lane running game. Use arrow keys or touch controls to dodge and jump."></canvas>

    <div class="hud" aria-live="polite">
      <div class="score-card"><span class="eyebrow">Run score</span><strong id="score">000</strong></div>
      <div class="best-card"><span class="eyebrow">Personal best</span><strong id="best">000</strong></div>
    </div>
    <button class="sound-button" id="sound" type="button" aria-label="Mute sounds">♫</button>
    <div class="toast" id="toast" role="status"></div>

    <div class="controls" aria-label="Touch controls">
      <div class="pad">
        <div><button class="control" id="left" type="button" aria-label="Move left">‹</button><span class="control-label">LEFT</span></div>
        <div><button class="control" id="right" type="button" aria-label="Move right">›</button><span class="control-label">RIGHT</span></div>
      </div>
      <div class="jump-wrap">
        <button class="control jump-control" id="jump" type="button" aria-label="Jump">↑</button>
        <span class="control-label">JUMP</span>
      </div>
    </div>

    <section class="overlay" id="overlay" aria-labelledby="title">
      <div class="panel">
        <span class="badge">🐾 &nbsp; a tiny big chase</span>
        <h1 id="title">RUN,<br><span>SIDDHU,</span><br>RUN!</h1>
        <p class="subhead" id="message">Three lanes. One very angry cat.<br>How far can you run?</p>
        <label class="upload" for="photo">
          <span aria-hidden="true">＋</span>
          <span id="upload-label">Use your own Siddhu photo</span>
          <input id="photo" type="file" accept="image/*">
        </label>
        <p class="photo-status" id="photo-status">Siddhu is ready to run!</p>
        <button class="action" id="start" type="button">LET'S RUN! &nbsp; →</button>
        <p class="hint" id="hint">← → change lanes &nbsp; · &nbsp; ↑ / SPACE jump</p>
      </div>
    </section>
  </main>

      };
      const W = 450;
      const H = 800;
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d", { alpha: false });
      const shell = document.querySelector(".game-shell");
      const overlay = document.getElementById("overlay");
      const scoreNode = document.getElementById("score");
      const bestNode = document.getElementById("best");
      const messageNode = document.getElementById("message");
      const startButton = document.getElementById("start");
      const toastNode = document.getElementById("toast");
      const photoStatus = document.getElementById("photo-status");
      const uploadLabel = document.getElementById("upload-label");
      const portrait = new Image();
      const sounds = {
        jump: new Audio(AUDIO_SRC.jump),
        milestone: new Audio(AUDIO_SRC.milestone),
        gameOver: new Audio(AUDIO_SRC.gameOver)
      };
      const lanes = [125, 225, 325];
      const storeKey = "run-siddhu-best-v1";
      const runner = { lane: 1, laneVisual: 1, jump: 1, stride: 0, x: 225 };
      let state = "ready";
      let score = 0;
      let highScore = loadHighScore();
      let lastTime = 0;
      let spawnClock = 0;
      let speed = 0.42;
      let obstacles = [];
      let particles = [];
      let cats = [];
      let milestoneReached = false;
      let muted = false;
      let toastTimer = 0;
      let pointerStart = null;
      let worldDistance = 0;

      portrait.onload = () => draw();
      portrait.src = PHOTO_SRC;
      bestNode.textContent = formatScore(highScore);
      Object.values(sounds).forEach(sound => { sound.preload = "auto"; });

      function loadHighScore() {
        try {
          const value = Number(localStorage.getItem(storeKey));
          return Number.isFinite(value) && value > 0 ? Math.floor(value) : 0;
        } catch (error) {
          console.warn("High score could not be loaded.", error);
          return 0;
        }
      }

      function saveHighScore(value) {
        try {
          localStorage.setItem(storeKey, String(value));
        } catch (error) {
          console.warn("High score could not be saved.", error);
        }
      }

      function formatScore(value) {
        return String(Math.floor(value)).padStart(3, "0");
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const rect = shell.getBoundingClientRect();
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
        draw();
      }

      function playSound(key) {
        if (muted) return;
        const sound = sounds[key];
        sound.currentTime = 0;
        const playing = sound.play();
        if (playing && typeof playing.catch === "function") {
          playing.catch(error => console.warn(`Could not play ${key} voice clip.`, error));
        }
      }

      function showToast(text) {
        toastNode.textContent = text;
        toastNode.classList.add("show");
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => toastNode.classList.remove("show"), 1800);
      }

      function resetGame() {
        score = 0;
        speed = 0.42;
        spawnClock = 0.75;
        obstacles = [];
        particles = [];
        cats = [];
        milestoneReached = false;
        worldDistance = 0;
        runner.lane = 1;
        runner.laneVisual = 1;
        runner.jump = 1;
        runner.stride = 0;
        runner.x = lanes[1];
        scoreNode.textContent = formatScore(0);
      }

      function startGame() {
        resetGame();
        state = "running";
        overlay.classList.add("hidden");
        lastTime = performance.now();
        window.requestAnimationFrame(frame);
      }

      function endGame() {
        if (state !== "running") return;
        state = "over";
        playSound("gameOver");
        const finalScore = Math.floor(score);
        const newRecord = finalScore > highScore;
        if (newRecord) {
          highScore = finalScore;
          bestNode.textContent = formatScore(highScore);
          saveHighScore(highScore);
        }
        messageNode.innerHTML = `You ran <strong style="color:#ffe66d">${finalScore}m</strong> before that cat caught up!<br>${newRecord ? "New personal best! 🏆" : "Fancy another dash?"}`;
        startButton.textContent = "RUN IT BACK!  ↻";
        document.getElementById("title").innerHTML = "OH NO!<br><span>CAUGHT!</span>";
        document.getElementById("hint").textContent = "Tap the button and give it another go.";
        overlay.classList.remove("hidden");
        draw();
      }

      function moveLane(direction) {
        if (state !== "running") return;
        runner.lane = Math.max(0, Math.min(2, runner.lane + direction));
      }

      function jump() {
        if (state !== "running" || runner.jump < 1) return;
        runner.jump = 0;
        playSound("jump");
      }

      function spawnObstacle() {
        const blockedCount = Math.random() < 0.26 ? 2 : 1;
        const firstLane = Math.floor(Math.random() * 3);
        const blocked = new Set([firstLane]);
        if (blockedCount === 2) {
          blocked.add((firstLane + (Math.random() < 0.5 ? 1 : 2)) % 3);
        }
        blocked.forEach(lane => obstacles.push({
          lane,
          z: 0,
          type: ["box", "rock", "barrier"][Math.floor(Math.random() * 3)],
          hit: false,
          phase: Math.random() * Math.PI * 2
        }));
      }

      function update(dt) {
        if (state !== "running") return;
        worldDistance += dt * speed;
        score += dt * 6.3;
        scoreNode.textContent = formatScore(score);
        speed = Math.min(0.82, 0.42 + score / 450);
        runner.laneVisual += (runner.lane - runner.laneVisual) * Math.min(1, dt * 13);
        runner.x = lanes[0] + runner.laneVisual * (lanes[1] - lanes[0]);
        runner.stride += dt * (10 + speed * 7);
        if (runner.jump < 1) runner.jump = Math.min(1, runner.jump + dt * 1.7);

        spawnClock -= dt;
        if (spawnClock <= 0) {
          spawnObstacle();
          spawnClock = Math.max(0.82, 1.5 - score / 180) + Math.random() * 0.42;
        }

        if (!milestoneReached && score >= 25) {
          milestoneReached = true;
          cats = [0, 1, 2].map((_, i) => ({ offset: i, phase: Math.random() * 10 }));
          playSound("milestone");
          showToast("25m! The cat called its friends! 🐈");
        }

        const playerZ = 0.87;
        for (const obstacle of obstacles) {
          obstacle.z += dt * speed;
          if (!obstacle.hit && obstacle.z >= playerZ - 0.035 && obstacle.z <= playerZ + 0.035 &&
              Math.round(runner.laneVisual) === obstacle.lane && (runner.jump < 0.16 || runner.jump > 0.84)) {
            endGame();
            return;
          }
        }
        obstacles = obstacles.filter(obstacle => obstacle.z < 1.05);

        particles = particles.filter(p => p.life > 0);
        for (const particle of particles) {
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 220 * dt;
        }
      }

      function roundedRect(x, y, w, h, r) {
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, r);
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, H * 0.57);
        sky.addColorStop(0, "#75d9e7");
        sky.addColorStop(1, "#c8f2d5");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, W, H);

        ctx.fillStyle = "#ffdf80";
        ctx.beginPath();
        ctx.arc(352, 155, 44, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#83cfae";
        ctx.beginPath();
        ctx.moveTo(0, 358); ctx.lineTo(45, 277); ctx.lineTo(93, 351);
        ctx.lineTo(152, 255); ctx.lineTo(222, 365); ctx.lineTo(280, 288);
        ctx.lineTo(350, 358); ctx.lineTo(399, 280); ctx.lineTo(450, 352);
        ctx.lineTo(450, 471); ctx.lineTo(0, 471); ctx.closePath(); ctx.fill();

        ctx.fillStyle = "#70bd9c";
        for (let i = 0; i < 7; i++) {
          const x = ((i * 82 - worldDistance * 8) % 540 + 540) % 540 - 45;
          ctx.fillRect(x, 330, 8, 145);
          ctx.beginPath();
          ctx.moveTo(x - 25, 353); ctx.lineTo(x + 4, 278); ctx.lineTo(x + 34, 353);
          ctx.fill();
        }

        const road = ctx.createLinearGradient(0, 385, 0, H);
        road.addColorStop(0, "#806d8d");
        road.addColorStop(1, "#403e62");
        ctx.fillStyle = road;
        ctx.beginPath();
        ctx.moveTo(141, 380); ctx.lineTo(309, 380); ctx.lineTo(450, H); ctx.lineTo(0, H);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#fff1bd";
        ctx.beginPath();
        ctx.moveTo(136, 380); ctx.lineTo(141, 380); ctx.lineTo(-5, H); ctx.lineTo(-16, H);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(309, 380); ctx.lineTo(314, 380); ctx.lineTo(466, H); ctx.lineTo(455, H);
        ctx.closePath(); ctx.fill();

        for (let line = 1; line <= 2; line++) {
          const topX = 141 + (line - 1) * 56;
          const bottomX = 150 + (line - 1) * 150;
          for (let i = 0; i < 8; i++) {
            const z = ((i / 8 + worldDistance * 0.82) % 1);
            const y = 390 + z * z * 435;
            const width = 2 + z * 7;
            const x = topX + (bottomX - topX) * z;
            ctx.globalAlpha = 0.38 + z * 0.5;
            ctx.fillStyle = "#fff4d0";
            roundedRect(x - width / 2, y, width, 9 + z * 25, width / 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;

        for (let i = 0; i < 8; i++) {
          const y = 405 + ((i * 64 + worldDistance * 75) % 460);
          const side = i % 2 === 0 ? -1 : 1;
          const x = side < 0 ? 44 - y * .025 : 406 + y * .025;
          ctx.fillStyle = "#fff3c8";
          ctx.beginPath();
          ctx.ellipse(x, y, 4 + y / 75, 2 + y / 150, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function laneX(lane, z) {
        const top = 168 + lane * 57;
        const bottom = lanes[lane];
        return top + (bottom - top) * z;
      }

      function drawObstacle(obstacle) {
        const z = obstacle.z;
        const x = laneX(obstacle.lane, z);
        const y = 390 + z * z * 435;
        const scale = 0.25 + z * 0.92;
        const w = 34 * scale;
        const h = (obstacle.type === "barrier" ? 29 : 31) * scale;
        ctx.fillStyle = "#15152d44";
        ctx.beginPath();
        ctx.ellipse(x, y + 5, w * .72, 7 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        if (obstacle.type === "box") {
          ctx.fillStyle = "#c96345";
          ctx.fillRect(x - w / 2, y - h, w, h);
          ctx.fillStyle = "#f69a59";
          ctx.beginPath(); ctx.moveTo(x - w / 2, y - h); ctx.lineTo(x - w / 2 + 8 * scale, y - h - 7 * scale);
          ctx.lineTo(x + w / 2 + 8 * scale, y - h - 7 * scale); ctx.lineTo(x + w / 2, y - h); ctx.fill();
          ctx.fillStyle = "#8b3f42";
          ctx.fillRect(x - w / 2 + 5 * scale, y - h + 8 * scale, w - 10 * scale, 4 * scale);
          ctx.strokeStyle = "#ffbf7a";
          ctx.lineWidth = 3 * scale;
          ctx.strokeRect(x - w / 2, y - h, w, h);
        } else if (obstacle.type === "rock") {
          ctx.fillStyle = "#65717e";
          ctx.beginPath();
          ctx.moveTo(x - w / 2, y); ctx.lineTo(x - w * .45, y - h * .65);
          ctx.lineTo(x - w * .12, y - h); ctx.lineTo(x + w * .32, y - h * .87);
          ctx.lineTo(x + w / 2, y - h * .48); ctx.lineTo(x + w * .42, y); ctx.closePath();
          ctx.fill();
          ctx.fillStyle = "#9eacb1";
          ctx.beginPath(); ctx.ellipse(x - w * .12, y - h * .67, w * .18, h * .13, -.3, 0, Math.PI * 2); ctx.fill();
        } else {
          ctx.fillStyle = "#f7b84f";
          ctx.fillRect(x - w / 2, y - h, w, h);
          ctx.fillStyle = "#fff1c4";
          ctx.save(); ctx.beginPath(); ctx.rect(x - w / 2, y - h, w, h); ctx.clip();
          for (let stripe = -2; stripe < 5; stripe++) {
            ctx.beginPath();
            ctx.moveTo(x - w / 2 + stripe * 12 * scale, y);
            ctx.lineTo(x - w / 2 + stripe * 12 * scale + 15 * scale, y);
            ctx.lineTo(x - w / 2 + stripe * 12 * scale + 26 * scale, y - h);
            ctx.lineTo(x - w / 2 + stripe * 12 * scale + 11 * scale, y - h);
            ctx.closePath(); ctx.fill();
          }
          ctx.restore();
        }
      }

      function drawCat(x, y, scale, angry) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        const bob = Math.sin(worldDistance * 7 + x) * 3;
        ctx.translate(0, bob);
        ctx.fillStyle = angry ? "#493049" : "#6b4261";
        ctx.beginPath(); ctx.ellipse(0, 17, 26, 19, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -4, 21, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-17, -15); ctx.lineTo(-19, -35); ctx.lineTo(-5, -22); ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(17, -15); ctx.lineTo(19, -35); ctx.lineTo(5, -22); ctx.closePath(); ctx.fill();
        ctx.fillStyle = "#ff9f70";
        ctx.beginPath(); ctx.moveTo(-14, -18); ctx.lineTo(-16, -29); ctx.lineTo(-8, -21); ctx.fill();
        ctx.beginPath(); ctx.moveTo(14, -18); ctx.lineTo(16, -29); ctx.lineTo(8, -21); ctx.fill();
        ctx.fillStyle = "#ffe66d";
        ctx.beginPath(); ctx.ellipse(-8, -5, 3.2, 5, -.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(8, -5, 3.2, 5, .2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#262035";
        ctx.beginPath(); ctx.arc(-8, -5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(8, -5, 1.3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff8b89";
        ctx.beginPath(); ctx.moveTo(-3, 2); ctx.lineTo(3, 2); ctx.lineTo(0, 5); ctx.closePath(); ctx.fill();
        ctx.strokeStyle = "#312235";
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(-3, 8); ctx.lineTo(0, 6); ctx.lineTo(3, 8); ctx.stroke();
        ctx.strokeStyle = "#f6dfd0";
        ctx.lineWidth = 1;
        for (let i = 0; i < 3; i++) {
          ctx.beginPath(); ctx.moveTo(-8, 4 + i * 4); ctx.lineTo(-26, 1 + i * 4); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(8, 4 + i * 4); ctx.lineTo(26, 1 + i * 4); ctx.stroke();
        }
        if (angry) {
          ctx.strokeStyle = "#312235";
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.moveTo(-14, -14); ctx.lineTo(-4, -10); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(14, -14); ctx.lineTo(4, -10); ctx.stroke();
        }
        ctx.strokeStyle = "#493049";
        ctx.lineWidth = 6;
        ctx.beginPath(); ctx.moveTo(22, 21); ctx.quadraticCurveTo(43, 13, 35, -1); ctx.stroke();
        ctx.strokeStyle = "#fff3d4";
        ctx.lineWidth = 4;
        const legSwing = Math.sin(worldDistance * 10 + x) * 6;
        for (const side of [-1, 1]) {
          ctx.beginPath(); ctx.moveTo(side * 13, 27); ctx.lineTo(side * 13 + legSwing * side, 36); ctx.stroke();
        }
        ctx.restore();
      }

      function drawRunner() {
        const jumpHeight = Math.sin(runner.jump * Math.PI) * 95;
        const y = 646 - jumpHeight;
        const x = runner.x;
        const swing = Math.sin(runner.stride) * 12;

        ctx.fillStyle = "#17152d45";
        ctx.beginPath(); ctx.ellipse(x, 705, 32, Math.max(5, 11 - jumpHeight * .05), 0, 0, Math.PI * 2); ctx.fill();

        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((runner.lane - runner.laneVisual) * .17);
        ctx.lineCap = "round";

        ctx.strokeStyle = "#263a6c";
        ctx.lineWidth = 13;
        ctx.beginPath(); ctx.moveTo(-8, 34); ctx.lineTo(-13 - swing * .45, 58); ctx.lineTo(-8 + swing * .7, 76); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, 34); ctx.lineTo(14 + swing * .45, 57); ctx.lineTo(10 - swing * .7, 75); ctx.stroke();

        ctx.fillStyle = "#fff9ee";
        ctx.beginPath(); ctx.ellipse(-8 + swing * .7, 78, 13, 6, -.15, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(10 - swing * .7, 77, 13, 6, .15, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = "#f6f1e9";
        roundedRect(-21, -2, 42, 48, 12); ctx.fill();
        ctx.fillStyle = "#cbd8e9";
        roundedRect(-21, 28, 42, 18, 8); ctx.fill();
        ctx.fillStyle = "#66513e";
        roundedRect(-21, 28, 42, 7, 3); ctx.fill();
        ctx.fillStyle = "#e4ae74";
        roundedRect(-20, 6, 40, 4, 2); ctx.fill();

        ctx.strokeStyle = "#d79b72";
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(-17, 4); ctx.lineTo(-27 - swing * .4, 24); ctx.lineTo(-21 - swing * .4, 32); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(17, 4); ctx.lineTo(28 + swing * .4, 19); ctx.lineTo(23 + swing * .4, 27); ctx.stroke();

        ctx.fillStyle = "#e9c097";
        ctx.beginPath(); ctx.arc(0, -20, 25, 0, Math.PI * 2); ctx.fill();
        ctx.save();
        ctx.beginPath(); ctx.ellipse(0, -20, 22, 25, 0, 0, Math.PI * 2); ctx.clip();
        if (portrait.complete && portrait.naturalWidth) {
          const sourceWidth = portrait.naturalWidth;
          const sourceHeight = portrait.naturalHeight;
          const cropW = sourceWidth * .45;
          const cropH = sourceHeight * .16;
          const cropX = sourceWidth * .16;
          const cropY = 0;
          ctx.drawImage(portrait, cropX, cropY, cropW, cropH, -23, -45, 46, 50);
        } else {
          ctx.fillStyle = "#d49a73"; ctx.fillRect(-24, -45, 48, 50);
          ctx.fillStyle = "#211b27";
          ctx.beginPath(); ctx.arc(0, -34, 20, Math.PI, 0); ctx.fill();
        }
        ctx.restore();
        ctx.strokeStyle = "#654c49";
        ctx.lineWidth = 2;
        ctx.fillStyle = "#ffdc58";
        ctx.beginPath(); ctx.ellipse(0, -43, 17, 6, 0, Math.PI, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ed8d55";
        ctx.beginPath(); ctx.arc(-16, -40, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(16, -40, 5, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      function drawParticles() {
        for (const p of particles) {
          ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
          ctx.fillStyle = p.color;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function draw() {
        if (!ctx) return;
        drawBackground();
        if (cats.length) {
          cats.forEach((cat, i) => {
            const side = i === 0 ? 0 : (i % 2 ? -1 : 1);
            drawCat(225 + side * (28 + i * 5), 575 + (i % 2) * 14, .98 - i * .08, true);
          });
        } else {
          drawCat(225, 560, 1.2, true);
          ctx.fillStyle = "#fff1d2";
          ctx.font = "900 10px Trebuchet MS, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("MEOW! I'M RIGHT BEHIND YOU!", 225, 514);
        }
        obstacles.slice().sort((a, b) => a.z - b.z).forEach(drawObstacle);
        drawRunner();
        drawParticles();
      }

      function frame(now) {
        if (state !== "running") return;
        const dt = Math.min((now - lastTime) / 1000, .04);
        lastTime = now;
        update(dt);
        draw();
        if (state === "running") window.requestAnimationFrame(frame);
      }

      document.getElementById("left").addEventListener("click", () => moveLane(-1));
      document.getElementById("right").addEventListener("click", () => moveLane(1));
      document.getElementById("jump").addEventListener("click", jump);
      startButton.addEventListener("click", startGame);
      document.getElementById("sound").addEventListener("click", event => {
        muted = !muted;
        event.currentTarget.textContent = muted ? "♪̸" : "♫";
        event.currentTarget.setAttribute("aria-label", muted ? "Turn sounds on" : "Mute sounds");
      });

      document.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", " ", "a", "A", "d", "D", "w", "W"].includes(event.key)) event.preventDefault();
        if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") moveLane(-1);
        if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") moveLane(1);
        if (event.key === "ArrowUp" || event.key === " " || event.key === "w" || event.key === "W") jump();
        if (event.key === "Enter" && state !== "running") startGame();
      });

      canvas.addEventListener("pointerdown", event => {
        pointerStart = { x: event.clientX, y: event.clientY };
      });
      canvas.addEventListener("pointerup", event => {
        if (!pointerStart || state !== "running") { pointerStart = null; return; }
        const dx = event.clientX - pointerStart.x;
        const dy = event.clientY - pointerStart.y;
        if (Math.max(Math.abs(dx), Math.abs(dy)) < 22) {
          jump();
        } else if (Math.abs(dx) > Math.abs(dy)) {
          moveLane(dx < 0 ? -1 : 1);
        } else if (dy < 0) {
          jump();
        }
        pointerStart = null;
      });
      canvas.addEventListener("pointercancel", () => { pointerStart = null; });

      document.getElementById("photo").addEventListener("change", event => {
        const file = event.currentTarget.files && event.currentTarget.files[0];
        if (!file) return;
        if (!file.type.startsWith("image/")) {
          photoStatus.textContent = "Please choose an image file.";
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => {
          photoStatus.textContent = "Could not read that photo. Try another one.";
          console.error("Could not read uploaded portrait.", reader.error);
        };
        reader.onload = () => {
          const uploaded = new Image();
          uploaded.onerror = () => {
            photoStatus.textContent = "That image could not be opened.";
            console.error("Could not decode uploaded portrait.");
          };
          uploaded.onload = () => {
            portrait.src = String(reader.result);
            photoStatus.textContent = "Looking good! Siddhu is ready.";
            uploadLabel.textContent = "Change Siddhu's photo";
            draw();
          };
          uploaded.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      });

      window.addEventListener("resize", resize);
      window.addEventListener("orientationchange", resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
